<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="
    https://cdn.jsdelivr.net/npm/material-icons@1.13.14/iconfont/material-icons.min.css
    " rel="stylesheet">
    <title>Lista de Tarefas</title>
</head>


<body>



    <h1>Lista de Tarefas</h1>
    
    <header>
        <input id="inputTarefa" type="text" placeholder="Digite sua tarefa"> 
        <button class="add"> Adicionar</button>
    </header>

    <main id="areaLista">
        <div class="item">
            <div class="item-icone">
                <i class="material-icons">radio_button_unchecked</i>
            </div>
            <div class="item-nome">
                Teste Tarefa
            </div>
            <div class="item-botao">
                <button class="delete"><i class="material-icons">delete</i> Deletar</button>
            </div>
        </div>
          <div class="item clicado">
            <div class="item-icone">
                <i class="material-icons check_circle">check_circle</i>
            </div>
            <div class="item-nome">
                Teste Tarefa
            </div>
            <div class="item-botao">
                <button class="delete"><i class="material-icons">delete</i> Deletar</button>
            </div>
        </div>
    </main>
    
    <script src="js/controle.js"></script>
</body>

</html>
